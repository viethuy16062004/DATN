version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: aiclassroom_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ai_classroom
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aiclassroom_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Gateway (Node.js + Express + Google Gemini API)
  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: aiclassroom_ai_gateway
    restart: always
    environment:
      PORT: 5000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "5000:5000"
    networks:
      - aiclassroom_network

  # Backend (Spring Boot 3 + Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiclassroom_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ai-gateway:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_classroom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AI_GATEWAY_URL: http://ai-gateway:5000
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    networks:
      - aiclassroom_network

  # Frontend (React 19 + Vite + Tailwind CSS + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiclassroom_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - aiclassroom_network

networks:
  aiclassroom_network:
    driver: bridge

volumes:
  mysql_data:
